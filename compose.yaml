name: tutor-platform

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: .
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1001,gid=1001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      TUTOR_DATA_BACKEND: postgres
      PUBLIC_APP_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}
      DATABASE_URL: postgresql://tutor:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/tutor_platform
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:?PLATFORM_ADMIN_EMAIL is required}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-}
      TELEGRAM_RELAY_SECRET: ${TELEGRAM_RELAY_SECRET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ru-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PHOTOS_PREFIX: ${S3_PHOTOS_PREFIX:-tutor-platform/lesson-photos}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      LEGAL_DOCUMENTS_DIR: /legal-documents
    volumes:
      - ./private/legal-documents:/legal-documents:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      target: builder
    restart: "no"
    command: ["npm", "run", "db:migrate:postgres"]
    environment:
      DATABASE_URL: postgresql://tutor:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/tutor_platform
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["node", "scripts/run-maintenance.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://tutor:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/tutor_platform
      JOB_INTERVAL_MS: 900000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-}
      TELEGRAM_RELAY_SECRET: ${TELEGRAM_RELAY_SECRET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ru-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PHOTOS_PREFIX: ${S3_PHOTOS_PREFIX:-tutor-platform/lesson-photos}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully

  backup:
    profiles: ["operations"]
    build:
      context: .
      dockerfile: ops/backup/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: tutor
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      PGDATABASE: tutor_platform
      RESTIC_REPOSITORY: s3:${S3_ENDPOINT:-https://s3.example.com}/${S3_BUCKET:-replace-me}/${S3_PREFIX:-tutor-platform}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${S3_REGION:-auto}
      BACKUP_HOST_TAG: ${APP_DOMAIN:-tutor-platform}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/tutor-last-backup && test $$(($$(date +%s) - $$(stat -c %Y /tmp/tutor-last-backup))) -lt 93600"]
      interval: 15m
      timeout: 10s
      retries: 2
      start_period: 10m
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.7-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: tutor_platform
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d tutor_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 256mb

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
