# Probes for secrets and admin panels that Tyuttori never serves (.env, .git, WordPress, PHP…).
# The log is Caddy's JSON access log inside Docker's json-file wrapper, so quotes are escaped.
[Definition]
failregex = ^\{"log":"\{.*\\"remote_ip\\":\\"<HOST>\\".*\\"uri\\":\\"[^\\"]*(?:\.env|\.git/|\.git\\"|\.aws|\.ssh|wp-login|wp-admin|wp-content|xmlrpc|phpinfo|phpmyadmin|\.php|cgi-bin|\.sql|\.bak|/actuator|/vendor/|/\.\.%%2F)
ignoreregex =
datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%S
