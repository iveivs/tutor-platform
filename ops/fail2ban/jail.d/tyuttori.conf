# Bans go into DOCKER-USER: Caddy runs in Docker, so INPUT rules would not see this traffic.
[tyuttori-scan]
enabled = true
filter = tyuttori-scan
logpath = /var/lib/docker/containers/*/*-json.log
backend = polling
maxretry = 3
findtime = 10m
bantime = 1d
banaction = iptables-allports[chain="DOCKER-USER"]
ignoreip = 127.0.0.1/8 ::1

[tyuttori-flood]
enabled = true
filter = tyuttori-flood
logpath = /var/lib/docker/containers/*/*-json.log
backend = polling
maxretry = 900
findtime = 1m
bantime = 1h
banaction = iptables-allports[chain="DOCKER-USER"]
ignoreip = 127.0.0.1/8 ::1
